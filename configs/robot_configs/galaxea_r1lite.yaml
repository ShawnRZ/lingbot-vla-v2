states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state: {start: 0, end: 12}
  - observation.state.effector.position:
      origin_keys:
        - observation.state: {start: 12, end: 14}

actions:
  - action.arm.position:
      origin_keys:
        - action: {start: 0, end: 12}
      subtract_state: true     # 真机数据官方推荐 true（学相对增量）
      # 关节空间必须显式置 null：默认值 quaternion_local 会走末端位姿的四元数相对变换
      relative_type: null
  - action.effector.position:
      origin_keys:
        - action: {start: 12, end: 14}
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.head_left
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.wrist_left
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.wrist_right

norm_stats: assets/norm_stats/galaxea_r1lite.json